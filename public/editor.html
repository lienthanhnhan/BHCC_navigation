<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BHCC Map Data Editor</title>
    <style>
      :root { --accent:#c40000; --accent-dark:#8f0000; --navy:#102744; --text:#111; --muted:#555; --border:#d7d7d7; --panel:#fff; --soft:#f5f5f5; --paper:#f7f7f2; --route:#d60000; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--text); background: #fff; }
      button, input, select, textarea { font: inherit; }
      a { color: #0048c8; }
      .editor-shell { width: min(1800px, calc(100% - 40px)); margin: 0 auto; padding: 22px 0 40px; }
      .editor-header { display: flex; justify-content: space-between; gap: 20px; align-items: end; margin-bottom: 18px; border-bottom: 6px solid var(--accent); padding-bottom: 14px; }
      .editor-header h1 { margin: 0; color: var(--accent); font-size: clamp(1.8rem, 3vw, 2.5rem); font-weight: 400; }
      .editor-header p { margin: 6px 0 0; color: var(--muted); }
      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .toolbar label { display: flex; gap: 8px; align-items: center; }
      .shape-palette { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
      .shape-palette span { color: var(--muted); font-size: .9rem; font-weight: 700; }
      .shape-tool { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border); background: #fff; color: var(--text); padding: 8px 10px; cursor: grab; font-weight: 700; }
      .shape-tool:active { cursor: grabbing; }
      .shape-tool.active { border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); color: var(--accent); }
      .shape-swatch { width: 18px; height: 12px; border: 1px solid var(--accent); background: #fff36a; display: inline-block; }
      .shape-swatch.corridor { width: 24px; height: 8px; background: white; border: 2px solid #222; }
      .shape-swatch.stairs { background: var(--navy); border-color: var(--navy); }
      .shape-swatch.elevator { background: #8fd0e8; border-color: #27748e; }
      .shape-swatch.door { background: white; border-color: #777; }
      .button { border: 0; background: var(--accent); color: white; padding: 10px 14px; cursor: pointer; font-weight: 700; text-decoration: none; }
      .button:hover { background: var(--accent-dark); }
      .button.secondary { background: var(--navy); }
      .button.ghost { border: 1px solid var(--border); background: white; color: var(--text); }
      .button.danger { background: #6d0000; }
      .editor-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(360px, 0.65fr); gap: 18px; align-items: start; }
      .panel { border: 1px solid var(--border); background: var(--panel); }
      .panel-header { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border); background: var(--soft); }
      .panel-header h2 { margin: 0; font-size: 1.1rem; }
      .panel-body { padding: 14px; }
      .map-frame { overflow: auto; max-height: 72vh; border: 1px solid var(--accent); background: var(--paper); }
      .map-canvas { width: 1000px; min-width: 100%; height: 700px; background: var(--paper); }
      .map-overlay { display: block; width: 100%; height: 100%; cursor: crosshair; background: var(--paper); }
      .map-overlay.drop-ready { outline: 3px solid rgba(196,0,0,.28); outline-offset: -6px; }
      .floor-plate { fill: #fbfbf8; stroke: #1f1f1f; stroke-width: 1.2; vector-effect: non-scaling-stroke; }
      .building-label { fill: #333; font-size: 3px; font-weight: 900; text-transform: uppercase; pointer-events: none; }
      .corridor-wall { stroke: #222; stroke-width: 2.2; stroke-linecap: square; vector-effect: non-scaling-stroke; }
      .corridor-floor { stroke: var(--paper); stroke-width: 1.6; stroke-linecap: square; vector-effect: non-scaling-stroke; }
      .room-connector { fill: none; stroke: #777; stroke-width: .65; stroke-linecap: square; stroke-linejoin: miter; vector-effect: non-scaling-stroke; }
      .building-connector-wall { fill: none; stroke: #222; stroke-width: 2.8; stroke-linecap: square; vector-effect: non-scaling-stroke; }
      .building-connector-floor { fill: none; stroke: var(--paper); stroke-width: 2; stroke-linecap: square; vector-effect: non-scaling-stroke; }
      .graph-edge { stroke: rgba(196,0,0,.25); stroke-width: .24; stroke-dasharray: 1 1.2; vector-effect: non-scaling-stroke; }
      .graph-node { cursor: grab; }
      .graph-node:active { cursor: grabbing; }
      .graph-node rect { fill: #fff; stroke: var(--accent); stroke-width: .65; vector-effect: non-scaling-stroke; }
      .graph-node-room rect { fill: #fff36a; }
      .graph-node-corridor rect { fill: #fbfbf8; stroke: #222; stroke-width: 1.1; }
      .graph-node-stairs rect, .graph-node-elevator rect { fill: var(--navy); stroke: #fff; }
      .graph-node.selected rect { fill: var(--accent); stroke: #111; stroke-width: 1; }
      .graph-node text { fill: #111; paint-order: stroke; stroke: #fff; stroke-width: .65; font-size: 2.7px; font-weight: 900; text-anchor: middle; dominant-baseline: central; pointer-events: none; vector-effect: non-scaling-stroke; }
      .graph-node-corridor text { font-size: 2.2px; stroke-width: .35; }
      .graph-node-stairs text, .graph-node-elevator text, .graph-node.selected text { fill: #fff; stroke: #111; }
      .hint { margin: 10px 0 0; color: var(--muted); font-size: .92rem; }
      .forms { display: grid; gap: 14px; }
      .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .field { display: grid; gap: 5px; }
      .field.full { grid-column: 1 / -1; }
      .field span { font-size: .86rem; color: var(--muted); }
      input, select, textarea { width: 100%; border: 1px solid #bbb; border-radius: 0; padding: 9px 10px; background: white; color: var(--text); }
      input[type="checkbox"] { width: auto; margin-right: 7px; }
      textarea { min-height: 76px; resize: vertical; }
      .list { display: grid; gap: 6px; max-height: 220px; overflow: auto; padding: 0; margin: 0; list-style: none; }
      .list button { width: 100%; border: 1px solid var(--border); background: white; padding: 8px 10px; text-align: left; cursor: pointer; }
      .list button.active { border-color: var(--accent); background: #fff5f5; color: var(--accent); font-weight: 700; }
      .list small { color: var(--muted); margin-left: 6px; }
      .code-preview { display: block; max-height: 190px; overflow: auto; white-space: pre; padding: 10px; background: #f7f7f7; border: 1px solid var(--border); font-size: .84rem; }
      .status { min-height: 1.2em; color: var(--muted); }
      @media (max-width:1050px) { .editor-grid { grid-template-columns: 1fr; } .editor-header { display: grid; align-items: start; } }
      @media (max-width:640px) { .editor-shell { width: min(100% - 20px, 1800px); } .field-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main class="editor-shell">
      <header class="editor-header">
        <div><h1>BHCC Map Data Editor</h1><p>Edit nodes and edges visually, then export the updated JSON.</p></div>
        <div class="toolbar">
          <a href="./" class="button ghost">Back to app</a>
          <label>Floor <select id="floor-select"></select></label>
          <label>Building <select id="building-select"></select></label>
          <button id="add-node" class="button secondary" type="button">Add node</button>
          <button id="delete-node" class="button danger" type="button">Delete node</button>
          <button id="export-json" class="button" type="button">Export JSON</button>
        </div>
      </header>
      <section class="editor-grid">
        <article class="panel">
          <div class="panel-header"><h2 id="map-title">Floor map</h2><span id="map-count" class="status"></span></div>
          <div class="panel-body"><div id="shape-palette" class="shape-palette" aria-label="Create map item palette">
            <span>Create</span>
            <button class="shape-tool" type="button" draggable="true" data-kind="room"><i class="shape-swatch"></i>Room</button>
            <button class="shape-tool" type="button" draggable="true" data-kind="corridor"><i class="shape-swatch corridor"></i>Corridor</button>
            <button class="shape-tool" type="button" draggable="true" data-kind="stairs"><i class="shape-swatch stairs"></i>Stairs</button>
            <button class="shape-tool" type="button" draggable="true" data-kind="elevator"><i class="shape-swatch elevator"></i>Elevator</button>
            <button class="shape-tool" type="button" draggable="true" data-kind="door"><i class="shape-swatch door"></i>Door</button>
          </div><div class="map-frame"><div class="map-canvas"><svg id="map-overlay" class="map-overlay" preserveAspectRatio="xMinYMin meet" aria-label="Editable node map"></svg></div></div><p class="hint">Drag a shape onto the map, or click a shape and then click the map. Existing rectangles can be dragged to reposition them.</p></div>
        </article>
        <aside class="forms">
          <article class="panel"><div class="panel-header"><h2>Nodes</h2><span id="node-status" class="status"></span></div><div class="panel-body"><ul id="node-list" class="list"></ul></div></article>
          <article class="panel"><div class="panel-header"><h2>Selected node</h2></div><div class="panel-body"><form id="node-form" class="field-grid"><label class="field"><span>ID</span><input id="node-id" /></label><label class="field"><span>Label</span><input id="node-label" /></label><label class="field"><span>Kind</span><select id="node-kind"><option>room</option><option>corridor</option><option>stairs</option><option>elevator</option><option>door</option></select></label><label class="field"><span>Orientation</span><select id="node-orientation"><option value="horizontal">Horizontal</option><option value="vertical">Vertical</option></select></label><label class="field"><span>Floor</span><input id="node-floor" type="number" /></label><label class="field"><span>X</span><input id="node-x" type="number" step="0.1" /></label><label class="field"><span>Y</span><input id="node-y" type="number" step="0.1" /></label><label class="field"><span>Exit bearing</span><input id="node-exit-bearing" type="number" step="1" placeholder="optional" /></label><label class="field full"><span>Aliases, one per line</span><textarea id="node-aliases"></textarea></label></form><code id="node-json" class="code-preview"></code></div></article>
          <article class="panel"><div class="panel-header"><h2>Connections</h2><div class="toolbar"><button id="add-edge" class="button secondary" type="button">Add connection</button><button id="delete-edge" class="button danger" type="button">Delete connection</button></div></div><div class="panel-body forms"><ul id="edge-list" class="list"></ul><form id="edge-form" class="field-grid"><label class="field full"><span>ID</span><input id="edge-id" /></label><label class="field"><span>From</span><select id="edge-from"></select></label><label class="field"><span>From corridor point</span><select id="edge-from-endpoint"><option value="">Side / center</option><option value="start">Start (left / top)</option><option value="end">End (right / bottom)</option></select></label><label class="field"><span>To</span><select id="edge-to"></select></label><label class="field"><span>To corridor point</span><select id="edge-to-endpoint"><option value="">Side / center</option><option value="start">Start (left / top)</option><option value="end">End (right / bottom)</option></select></label><label class="field"><span>Weight</span><input id="edge-weight" type="number" step="0.1" /></label><label class="field"><span>Bearing</span><input id="edge-bearing" type="number" step="1" /></label><label class="field full"><span>Kind</span><select id="edge-kind"><option>walk</option><option>door</option><option>stairs</option><option>elevator</option></select></label><label class="field full"><span><input id="edge-bidirectional" type="checkbox" /> Two-way connection</span></label></form></div></article>
        </aside>
      </section>
    </main>
    <script type="module">
      const state = { data: null, level: null, building: 'all', selectedNode: null, selectedEdge: null, bounds: null, displayNodes: new Map(), displayBuildings: new Map(), manualPositions: new Map(), crossLevelEdges: [], createKind: null, draggingNode: null, movedNode: false };
      const $ = (id) => document.getElementById(id);
      const ids = Object.fromEntries(['floor-select','building-select','shape-palette','map-title','map-count','map-overlay','node-list','node-status','node-json','node-form','node-id','node-label','node-kind','node-orientation','node-floor','node-x','node-y','node-exit-bearing','node-aliases','edge-list','edge-form','edge-id','edge-from','edge-to','edge-from-endpoint','edge-to-endpoint','edge-weight','edge-bearing','edge-kind','edge-bidirectional','add-node','delete-node','add-edge','delete-edge','export-json'].map(id => [camel(id), $(id)]));

      init().catch(error => { document.body.innerHTML = '<main class="editor-shell"><p>Could not load editor data.</p><pre>' + escapeHtml(error) + '</pre></main>'; });

      async function init() {
        const response = await fetch('./data/levels-1-2.json');
        state.data = await response.json();
        state.crossLevelEdges = crossLevelEdges(state.data);
        ids.floorSelect.innerHTML = state.data.levels.map(level => '<option value="' + level.level + '">' + escapeHtml(level.label) + '</option>').join('');
        ids.floorSelect.addEventListener('change', () => selectLevel(Number(ids.floorSelect.value)));
        ids.buildingSelect.addEventListener('change', () => selectBuilding(ids.buildingSelect.value));
        ids.addNode.addEventListener('click', addNode);
        ids.deleteNode.addEventListener('click', deleteNode);
        ids.addEdge.addEventListener('click', addEdge);
        ids.deleteEdge.addEventListener('click', deleteEdge);
        ids.exportJson.addEventListener('click', exportJson);
        ids.nodeForm.addEventListener('input', updateSelectedNode);
        ids.edgeForm.addEventListener('input', updateSelectedEdge);
        ids.shapePalette.querySelectorAll('.shape-tool').forEach(button => {
          button.addEventListener('click', () => setCreateKind(button.dataset.kind));
          button.addEventListener('dragstart', event => startPaletteDrag(event, button.dataset.kind));
          button.addEventListener('dragend', clearDropState);
        });
        ids.mapOverlay.addEventListener('dragover', allowDropOnMap);
        ids.mapOverlay.addEventListener('dragleave', clearDropState);
        ids.mapOverlay.addEventListener('drop', dropNodeOnMap);
        ids.mapOverlay.addEventListener('pointermove', dragSelectedNode);
        ids.mapOverlay.addEventListener('pointerup', finishDraggingNode);
        ids.mapOverlay.addEventListener('pointercancel', finishDraggingNode);
        ids.mapOverlay.addEventListener('click', moveSelectedNodeFromMap);
        selectLevel(state.data.levels[0].level);
      }

      function camel(id) { return id.replace(/-([a-z])/g, (_, c) => c.toUpperCase()); }
      function crossLevelEdges(data) { const floorById = new Map(data.graph.nodes.map(node => [node.id, node.floor])); return data.graph.edges.filter(edge => floorById.get(edge.from) !== floorById.get(edge.to)); }
      function selectLevel(levelNumber) { state.level = state.data.levels.find(level => level.level === levelNumber); state.building = 'all'; state.selectedNode = visibleNodes()[0] || state.level.nodes[0] || null; state.selectedEdge = visibleEdges()[0] || state.level.edges[0] || null; renderAll(); }
      function selectBuilding(building) { state.building = building; state.selectedNode = visibleNodes()[0] || null; state.selectedEdge = visibleEdges()[0] || null; renderAll(); }
      function renderAll() { rebuildGraph(); renderBuildingOptions(); renderPalette(); renderMap(); renderNodeList(); renderNodeForm(); renderEdgeList(); renderEdgeForm(); }

      function renderBuildingOptions() {
        const buildings = [...new Set(state.level.nodes.map(buildingKey))].sort();
        ids.buildingSelect.innerHTML = '<option value="all">All buildings</option>' + buildings.map(building => '<option value="' + escapeHtml(building) + '">' + escapeHtml(building) + ' Building</option>').join('');
        ids.buildingSelect.value = buildings.includes(state.building) ? state.building : 'all';
      }

      function renderPalette() {
        ids.shapePalette.querySelectorAll('.shape-tool').forEach(button => button.classList.toggle('active', button.dataset.kind === state.createKind));
      }

      function renderMap() {
        const nodes = visibleNodes();
        const edges = visibleEdges();
        ids.mapTitle.textContent = state.level.label + ' architectural graph';
        const roomCount = nodes.filter(node => node.kind === 'room').length;
        const corridorCount = nodes.filter(node => node.kind === 'corridor').length;
        ids.mapCount.textContent = roomCount + ' rooms, ' + corridorCount + ' corridors, ' + edges.length + ' connections';
        state.displayNodes = layoutNodes(nodes);
        state.bounds = displayBounds(state.displayNodes, nodes.length ? nodes : state.level.nodes);
        ids.mapOverlay.setAttribute('viewBox', state.bounds.minX + ' ' + state.bounds.minY + ' ' + state.bounds.width + ' ' + state.bounds.height);
        sizeMapCanvas();
        ids.mapOverlay.innerHTML = '';
        renderArchitecturalBase(nodes, edges);
        for (const node of nodes) renderEditableNode(node);
      }

      function renderArchitecturalBase(nodes, edges) {
        renderFloorPlate();
        renderBuildingConnections(nodes, edges);
        renderCorridorConnections(nodes, edges);
        renderRoomConnections(nodes, edges);
      }

      function renderFloorPlate() {
        for (const [building, bounds] of state.displayBuildings) {
          ids.mapOverlay.append(svg('rect', { class: 'floor-plate', x: bounds.x, y: bounds.y, width: bounds.width, height: bounds.height }));
          const label = svg('text', { class: 'building-label', x: bounds.x + 4, y: bounds.y + 7 });
          label.textContent = building + ' Building';
          ids.mapOverlay.append(label);
        }
      }

      function renderCorridorConnections(nodes, edges) {
        const nodeById = new Map(nodes.map(node => [node.id, node]));
        for (const edge of uniqueConnections(edges)) {
          const from = nodeById.get(edge.from), to = nodeById.get(edge.to);
          if (!from || !to || !isPathNode(from) || !isPathNode(to) || buildingKey(from) !== buildingKey(to)) continue;
          const fromPoint = connectionPoint(from, edge.fromEndpoint), toPoint = connectionPoint(to, edge.toEndpoint);
          ids.mapOverlay.append(svg('line', { class: 'corridor-wall', 'data-edge-id': edge.id, x1: fromPoint.x, y1: fromPoint.y, x2: toPoint.x, y2: toPoint.y }));
          ids.mapOverlay.append(svg('line', { class: 'corridor-floor', 'data-edge-id': edge.id, x1: fromPoint.x, y1: fromPoint.y, x2: toPoint.x, y2: toPoint.y }));
        }
      }

      function renderBuildingConnections(nodes, edges) {
        const nodeById = new Map(nodes.map(node => [node.id, node]));
        for (const edge of uniqueConnections(edges)) {
          const from = nodeById.get(edge.from), to = nodeById.get(edge.to);
          if (!from || !to || buildingKey(from) === buildingKey(to)) continue;
          const start = connectionPoint(from, edge.fromEndpoint), end = connectionPoint(to, edge.toEndpoint);
          const path = buildingConnectionPath(start, end, edge.bearing);
          ids.mapOverlay.append(svg('path', { class: 'building-connector-wall', 'data-edge-id': edge.id, d: path }));
          ids.mapOverlay.append(svg('path', { class: 'building-connector-floor', 'data-edge-id': edge.id, d: path }));
        }
      }

      function renderRoomConnections(nodes, edges) {
        const nodeById = new Map(nodes.map(node => [node.id, node]));
        const orientationByBuilding = new Map([...groupNodesByBuilding(nodes)].map(([building, group]) => [building, buildingOrientation(group)]));
        for (const edge of edges) {
          const from = nodeById.get(edge.from), to = nodeById.get(edge.to);
          if (!from || !to) continue;
          if (buildingKey(from) !== buildingKey(to)) continue;
          const fromPoint = displayPoint(from), toPoint = displayPoint(to);
          if (!isPathNode(from) || !isPathNode(to)) {
            const navigationNode = isPathNode(from) ? from : to;
            const pathPoint = navigationNode.kind === 'corridor'
              ? corridorSidePoint(navigationNode, isPathNode(from) ? toPoint : fromPoint)
              : (isPathNode(from) ? fromPoint : toPoint);
            const roomPoint = isPathNode(from) ? toPoint : fromPoint;
            ids.mapOverlay.append(svg('path', { class: 'room-connector', 'data-edge-id': edge.id, d: orthogonalPath(pathPoint, roomPoint, orientationByBuilding.get(buildingKey(from)) || 'horizontal') }));
            continue;
          }
        }
      }

      function renderEditableNode(node) {
        const group = svg('g', { class: 'graph-node graph-node-' + node.kind + (node === state.selectedNode ? ' selected' : '') });
        const layout = state.displayNodes.get(node.id);
        const point = displayPoint(node);
        const width = layout?.width || nodeRectWidth(node), height = layout?.height || 5.8;
        group.append(svg('rect', { x: point.x - width / 2, y: point.y - height / 2, width, height, rx: .35 }));
        const orientation = node.kind === 'corridor' ? corridorOrientation(node) : 'horizontal';
        const labelLength = orientation === 'vertical' ? height : width;
        const textAttrs = { x: point.x, y: point.y };
        if (node.kind !== 'corridor') {
          textAttrs.textLength = Math.max(2, labelLength - 2.4);
          textAttrs.lengthAdjust = 'spacingAndGlyphs';
        }
        if (orientation === 'vertical') textAttrs.transform = 'rotate(90 ' + point.x + ' ' + point.y + ')';
        const text = svg('text', textAttrs);
        text.textContent = node.kind === 'corridor' ? node.label : fitLabel(node.label, labelLength);
        group.append(text);
        group.addEventListener('pointerdown', event => startDraggingNode(event, node));
        group.addEventListener('click', event => { event.stopPropagation(); selectNode(node); });
        ids.mapOverlay.append(group);
      }

      function renderNodeList() {
        const nodes = visibleNodes();
        ids.nodeStatus.textContent = state.selectedNode ? state.selectedNode.id : 'No node selected';
        ids.nodeList.innerHTML = nodes.map(node => '<li><button type="button" data-id="' + escapeHtml(node.id) + '" class="' + (node === state.selectedNode ? 'active' : '') + '">' + escapeHtml(node.label) + '<small>' + escapeHtml(node.kind) + '</small></button></li>').join('');
        ids.nodeList.querySelectorAll('button').forEach(button => button.addEventListener('click', () => selectNode(nodes.find(node => node.id === button.dataset.id))));
      }

      function renderNodeForm() {
        const node = state.selectedNode;
        ids.nodeForm.querySelectorAll('input, select, textarea').forEach(field => field.disabled = !node);
        if (!node) { ids.nodeForm.reset(); ids.nodeJson.textContent = ''; return; }
        ids.nodeId.value = node.id;
        ids.nodeLabel.value = node.label;
        ids.nodeKind.value = node.kind;
        ids.nodeOrientation.value = corridorOrientation(node);
        ids.nodeOrientation.disabled = node.kind !== 'corridor';
        ids.nodeFloor.value = node.floor;
        ids.nodeX.value = node.x;
        ids.nodeY.value = node.y;
        ids.nodeExitBearing.value = node.exitBearing ?? '';
        ids.nodeAliases.value = (node.aliases || []).join('\n');
        ids.nodeJson.textContent = JSON.stringify(node, null, 2);
      }

      function renderEdgeList() {
        const edges = visibleEdges();
        ids.edgeList.innerHTML = edges.map(edge => '<li><button type="button" data-id="' + escapeHtml(edge.id) + '" class="' + (edge === state.selectedEdge ? 'active' : '') + '">' + escapeHtml(edge.id) + '<small>' + endpointLabel(edge.from, edge.fromEndpoint) + (edge.bidirectional ? ' &harr; ' : ' &rarr; ') + endpointLabel(edge.to, edge.toEndpoint) + '</small></button></li>').join('');
        ids.edgeList.querySelectorAll('button').forEach(button => button.addEventListener('click', () => selectEdge(edges.find(edge => edge.id === button.dataset.id))));
        const options = visibleNodes().map(node => '<option value="' + escapeHtml(node.id) + '">' + escapeHtml(node.label) + '</option>').join('');
        ids.edgeFrom.innerHTML = options;
        ids.edgeTo.innerHTML = options;
      }

      function renderEdgeForm() {
        const edge = state.selectedEdge;
        ids.edgeForm.querySelectorAll('input, select').forEach(field => field.disabled = !edge);
        if (!edge) { ids.edgeForm.reset(); return; }
        ids.edgeId.value = edge.id;
        ids.edgeFrom.value = edge.from;
        ids.edgeTo.value = edge.to;
        ids.edgeFromEndpoint.value = edge.fromEndpoint || '';
        ids.edgeToEndpoint.value = edge.toEndpoint || '';
        ids.edgeWeight.value = edge.weight;
        ids.edgeBearing.value = edge.bearing;
        ids.edgeKind.value = edge.kind;
        ids.edgeBidirectional.checked = Boolean(edge.bidirectional);
        const nodeById = new Map(state.level.nodes.map(node => [node.id, node]));
        const joinsCorridors = nodeById.get(edge.from)?.kind === 'corridor' && nodeById.get(edge.to)?.kind === 'corridor';
        ids.edgeFromEndpoint.disabled = !joinsCorridors;
        ids.edgeToEndpoint.disabled = !joinsCorridors;
      }
      function selectNode(node) { state.selectedNode = node; renderAll(); }

      function kindLabel(kind) { return { room: 'Room', corridor: 'Corridor', stairs: 'Stairs', elevator: 'Elevator', door: 'Door' }[kind] || 'Node'; }

      function orthogonalPath(pathPoint, roomPoint, orientation) {
        if (orientation === 'vertical') {
          const elbowX = roomPoint.x > pathPoint.x ? roomPoint.x - 5 : roomPoint.x + 5;
          return 'M ' + pathPoint.x + ' ' + pathPoint.y + ' L ' + elbowX + ' ' + pathPoint.y + ' L ' + elbowX + ' ' + roomPoint.y + ' L ' + roomPoint.x + ' ' + roomPoint.y;
        }
        const elbowY = roomPoint.y > pathPoint.y ? roomPoint.y - 4.2 : roomPoint.y + 4.2;
        return 'M ' + pathPoint.x + ' ' + pathPoint.y + ' L ' + pathPoint.x + ' ' + elbowY + ' L ' + roomPoint.x + ' ' + elbowY + ' L ' + roomPoint.x + ' ' + roomPoint.y;
      }
      function buildingConnectionPath(start, end, bearing) {
        if (Math.abs(start.x - end.x) < 1 || Math.abs(start.y - end.y) < 1) return 'M ' + start.x + ' ' + start.y + ' L ' + end.x + ' ' + end.y;
        const direction = cardinalBearing(bearing);
        if (direction === 90 || direction === 270) {
          const middleX = round((start.x + end.x) / 2);
          return 'M ' + start.x + ' ' + start.y + ' L ' + middleX + ' ' + start.y + ' L ' + middleX + ' ' + end.y + ' L ' + end.x + ' ' + end.y;
        }
        const middleY = round((start.y + end.y) / 2);
        return 'M ' + start.x + ' ' + start.y + ' L ' + start.x + ' ' + middleY + ' L ' + end.x + ' ' + middleY + ' L ' + end.x + ' ' + end.y;
      }
      function corridorOrientation(node) { return node.kind === 'corridor' && node.orientation === 'vertical' ? 'vertical' : 'horizontal'; }
      function connectionPoint(node, endpoint) {
        const layout = state.displayNodes.get(node.id);
        const center = displayPoint(node);
        if (!layout || node.kind !== 'corridor' || !endpoint) return center;
        const direction = endpoint === 'start' ? -1 : 1;
        return corridorOrientation(node) === 'vertical'
          ? { x: center.x, y: center.y + direction * layout.height / 2 }
          : { x: center.x + direction * layout.width / 2, y: center.y };
      }
      function corridorSidePoint(corridor, targetPoint) {
        const layout = state.displayNodes.get(corridor.id);
        const center = displayPoint(corridor);
        if (!layout) return center;
        if (corridorOrientation(corridor) === 'vertical') {
          return {
            x: center.x + (targetPoint.x < center.x ? -layout.width / 2 : layout.width / 2),
            y: clamp(targetPoint.y, center.y - layout.height / 2 + 2, center.y + layout.height / 2 - 2)
          };
        }
        return {
          x: clamp(targetPoint.x, center.x - layout.width / 2 + 2, center.x + layout.width / 2 - 2),

        if (corridorOrientation(node) === 'vertical') return normalized < 90 || normalized >= 270 ? 'start' : 'end';
        return normalized >= 180 ? 'start' : 'end';
      }
      function applyDefaultEndpoints(edge, nodes) {
        const nodeById = new Map(nodes.map(node => [node.id, node]));
        const from = nodeById.get(edge.from), to = nodeById.get(edge.to);
        if (from?.kind !== 'corridor' || to?.kind !== 'corridor') return;
        edge.fromEndpoint = endpointForBearing(from, edge.bearing);
        edge.toEndpoint = endpointForBearing(to, normalizedBearing(edge.bearing + 180));
      }
      function endpointLabel(nodeId, endpoint) { return escapeHtml(nodeId) + (endpoint ? ' [' + escapeHtml(endpoint) + ']' : ''); }
      function setOptionalProperty(target, property, value) { if (value) target[property] = value; else delete target[property]; }
      function mapPointFromEvent(event) {
        const matrix = ids.mapOverlay.getScreenCTM();
        if (!matrix) return { x: round(state.bounds.minX), y: round(state.bounds.minY) };
        const point = ids.mapOverlay.createSVGPoint();
        point.x = event.clientX;
        point.y = event.clientY;
        const transformed = point.matrixTransform(matrix.inverse());
        return { x: round(transformed.x), y: round(transformed.y) };
      }
      function graphBounds(nodes) { if (!nodes.length) return { minX:-10, minY:-10, width:20, height:20 }; const xs = nodes.map(node => node.x), ys = nodes.map(node => node.y); const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys); const width = Math.max(1, maxX - minX), height = Math.max(1, maxY - minY), padding = Math.max(width, height) * .14; return { minX:minX-padding, minY:minY-padding, width:width+padding*2, height:height+padding*2 }; }
      function uniqueId(prefix) { const existing = new Set(state.data.levels.flatMap(level => level.nodes.map(node => node.id)).concat(state.data.levels.flatMap(level => level.edges.map(edge => edge.id)))); let index = 1; while (existing.has(prefix + '-' + index)) index += 1; return prefix + '-' + index; }
      function svg(name, attrs = {}) { const el = document.createElementNS('http://www.w3.org/2000/svg', name); for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, String(value)); return el; }

      function fitLabel(value, width) { const label = String(value); const limit = Math.max(3, Math.floor(width / .9)); return label.length <= limit ? label : label.slice(0, Math.max(1, limit - 3)) + '...'; }
      function normalizedBearing(value) { return ((value % 360) + 360) % 360; }
      function round(value) { return Math.round(value * 10) / 10; }
      function clamp(value, minimum, maximum) { return Math.max(minimum, Math.min(maximum, value)); }
      function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char])); }
    </script>
