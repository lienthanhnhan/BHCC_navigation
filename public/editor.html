<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BHCC Map Data Editor</title>
    <style>
      :root { --accent:#c40000; --accent-dark:#8f0000; --navy:#102744; --text:#111; --muted:#555; --border:#d7d7d7; --panel:#fff; --soft:#f5f5f5; --paper:#f7f7f2; --route:#d60000; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--text); background: #fff; }
      button, input, select, textarea { font: inherit; }
      a { color: #0048c8; }
      .editor-shell { width: min(1800px, calc(100% - 40px)); margin: 0 auto; padding: 22px 0 40px; }
      .editor-header { display: flex; justify-content: space-between; gap: 20px; align-items: end; margin-bottom: 18px; border-bottom: 6px solid var(--accent); padding-bottom: 14px; }
      .editor-header h1 { margin: 0; color: var(--accent); font-size: clamp(1.8rem, 3vw, 2.5rem); font-weight: 400; }
      .editor-header p { margin: 6px 0 0; color: var(--muted); }
      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .toolbar label { display: flex; gap: 8px; align-items: center; }
      .button { border: 0; background: var(--accent); color: white; padding: 10px 14px; cursor: pointer; font-weight: 700; text-decoration: none; }
      .button:hover { background: var(--accent-dark); }
      .button.secondary { background: var(--navy); }
      .button.ghost { border: 1px solid var(--border); background: white; color: var(--text); }
      .button.danger { background: #6d0000; }
      .editor-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(360px, 0.65fr); gap: 18px; align-items: start; }
      .panel { border: 1px solid var(--border); background: var(--panel); }
      .panel-header { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border); background: var(--soft); }
      .panel-header h2 { margin: 0; font-size: 1.1rem; }
      .panel-body { padding: 14px; }
      .map-frame { overflow: auto; max-height: 72vh; border: 1px solid var(--accent); background: var(--paper); }
      .map-canvas { width: 1000px; min-width: 100%; height: 700px; background: var(--paper); }
      .map-overlay { display: block; width: 100%; height: 100%; cursor: crosshair; background: var(--paper); }
      .floor-plate { fill: #fbfbf8; stroke: #1f1f1f; stroke-width: 1.2; vector-effect: non-scaling-stroke; }
      .corridor-wall { stroke: #222; stroke-width: 2.2; stroke-linecap: square; vector-effect: non-scaling-stroke; }
      .corridor-floor { stroke: var(--paper); stroke-width: 1.6; stroke-linecap: square; vector-effect: non-scaling-stroke; }
      .room-cell rect { fill: #fff; stroke: #555; stroke-width: .45; vector-effect: non-scaling-stroke; }
      .room-cell text { fill: #111; font-size: 2.4px; font-weight: 800; text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: #fff; stroke-width: .28; }
      .service-cell rect { stroke: #222; stroke-width: .5; vector-effect: non-scaling-stroke; }
      .service-cell text { fill: #111; font-size: 1.8px; font-weight: 800; text-anchor: middle; pointer-events: none; text-transform: uppercase; }
      .stairs-cell rect { fill: #f5dd28; }
      .elevator-cell rect { fill: #8fd0e8; }
      .graph-edge { stroke: rgba(196,0,0,.35); stroke-width: .24; stroke-dasharray: 1 1.2; vector-effect: non-scaling-stroke; }
      .graph-node { cursor: pointer; }
      .graph-node rect { fill: #fff; stroke: var(--accent); stroke-width: .65; vector-effect: non-scaling-stroke; }
      .graph-node-room rect { fill: #fff36a; }
      .graph-node-stairs rect, .graph-node-elevator rect { fill: var(--navy); stroke: #fff; }
      .graph-node.selected rect { fill: var(--accent); stroke: #111; stroke-width: 1; }
      .graph-node text { fill: #111; paint-order: stroke; stroke: #fff; stroke-width: .65; font-size: 2.7px; font-weight: 900; pointer-events: none; vector-effect: non-scaling-stroke; }
      .graph-node-stairs text, .graph-node-elevator text, .graph-node.selected text { fill: #fff; stroke: #111; }
      .hint { margin: 10px 0 0; color: var(--muted); font-size: .92rem; }
      .forms { display: grid; gap: 14px; }
      .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .field { display: grid; gap: 5px; }
      .field.full { grid-column: 1 / -1; }
      .field span { font-size: .86rem; color: var(--muted); }
      input, select, textarea { width: 100%; border: 1px solid #bbb; border-radius: 0; padding: 9px 10px; background: white; color: var(--text); }
      textarea { min-height: 76px; resize: vertical; }
      .list { display: grid; gap: 6px; max-height: 220px; overflow: auto; padding: 0; margin: 0; list-style: none; }
      .list button { width: 100%; border: 1px solid var(--border); background: white; padding: 8px 10px; text-align: left; cursor: pointer; }
      .list button.active { border-color: var(--accent); background: #fff5f5; color: var(--accent); font-weight: 700; }
      .list small { color: var(--muted); margin-left: 6px; }
      .code-preview { display: block; max-height: 190px; overflow: auto; white-space: pre; padding: 10px; background: #f7f7f7; border: 1px solid var(--border); font-size: .84rem; }
      .status { min-height: 1.2em; color: var(--muted); }
      @media (max-width:1050px) { .editor-grid { grid-template-columns: 1fr; } .editor-header { display: grid; align-items: start; } }
      @media (max-width:640px) { .editor-shell { width: min(100% - 20px, 1800px); } .field-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main class="editor-shell">
      <header class="editor-header">
        <div><h1>BHCC Map Data Editor</h1><p>Edit nodes and edges visually, then export the updated JSON.</p></div>
        <div class="toolbar">
          <a href="./" class="button ghost">Back to app</a>
          <label>Floor <select id="floor-select"></select></label>
          <label>Building <select id="building-select"></select></label>
          <button id="add-node" class="button secondary" type="button">Add node</button>
          <button id="delete-node" class="button danger" type="button">Delete node</button>
          <button id="export-json" class="button" type="button">Export JSON</button>
        </div>
      </header>
      <section class="editor-grid">
        <article class="panel">
          <div class="panel-header"><h2 id="map-title">Floor map</h2><span id="map-count" class="status"></span></div>
          <div class="panel-body"><div class="map-frame"><div class="map-canvas"><svg id="map-overlay" class="map-overlay" preserveAspectRatio="xMidYMid meet" aria-label="Editable node map"></svg></div></div><p class="hint">Filter by floor, then building. Click a rectangle to edit it. Click empty map space to move the selected node.</p></div>
        </article>
        <aside class="forms">
          <article class="panel"><div class="panel-header"><h2>Nodes</h2><span id="node-status" class="status"></span></div><div class="panel-body"><ul id="node-list" class="list"></ul></div></article>
          <article class="panel"><div class="panel-header"><h2>Selected node</h2></div><div class="panel-body"><form id="node-form" class="field-grid"><label class="field"><span>ID</span><input id="node-id" /></label><label class="field"><span>Label</span><input id="node-label" /></label><label class="field"><span>Kind</span><select id="node-kind"><option>room</option><option>corridor</option><option>intersection</option><option>stairs</option><option>elevator</option><option>door</option></select></label><label class="field"><span>Floor</span><input id="node-floor" type="number" /></label><label class="field"><span>X</span><input id="node-x" type="number" step="0.1" /></label><label class="field"><span>Y</span><input id="node-y" type="number" step="0.1" /></label><label class="field"><span>Exit bearing</span><input id="node-exit-bearing" type="number" step="1" placeholder="optional" /></label><label class="field full"><span>Aliases, one per line</span><textarea id="node-aliases"></textarea></label></form><code id="node-json" class="code-preview"></code></div></article>
          <article class="panel"><div class="panel-header"><h2>Edges</h2><div class="toolbar"><button id="add-edge" class="button secondary" type="button">Add edge</button><button id="delete-edge" class="button danger" type="button">Delete edge</button></div></div><div class="panel-body forms"><ul id="edge-list" class="list"></ul><form id="edge-form" class="field-grid"><label class="field full"><span>ID</span><input id="edge-id" /></label><label class="field"><span>From</span><select id="edge-from"></select></label><label class="field"><span>To</span><select id="edge-to"></select></label><label class="field"><span>Weight</span><input id="edge-weight" type="number" step="0.1" /></label><label class="field"><span>Bearing</span><input id="edge-bearing" type="number" step="1" /></label><label class="field full"><span>Kind</span><select id="edge-kind"><option>walk</option><option>door</option><option>stairs</option><option>elevator</option></select></label></form></div></article>
        </aside>
      </section>
    </main>
    <script type="module">
      const state = { data: null, level: null, building: 'all', selectedNode: null, selectedEdge: null, bounds: null, displayNodes: new Map(), crossLevelEdges: [] };
      const $ = (id) => document.getElementById(id);
      const ids = Object.fromEntries(['floor-select','building-select','map-title','map-count','map-overlay','node-list','node-status','node-json','node-form','node-id','node-label','node-kind','node-floor','node-x','node-y','node-exit-bearing','node-aliases','edge-list','edge-form','edge-id','edge-from','edge-to','edge-weight','edge-bearing','edge-kind','add-node','delete-node','add-edge','delete-edge','export-json'].map(id => [camel(id), $(id)]));

      init().catch(error => { document.body.innerHTML = '<main class="editor-shell"><p>Could not load editor data.</p><pre>' + escapeHtml(error) + '</pre></main>'; });

      async function init() {
        const response = await fetch('./data/levels-1-2.json');
        state.data = await response.json();
        state.crossLevelEdges = crossLevelEdges(state.data);
        ids.floorSelect.innerHTML = state.data.levels.map(level => '<option value="' + level.level + '">' + escapeHtml(level.label) + '</option>').join('');
        ids.floorSelect.addEventListener('change', () => selectLevel(Number(ids.floorSelect.value)));
        ids.buildingSelect.addEventListener('change', () => selectBuilding(ids.buildingSelect.value));
        ids.addNode.addEventListener('click', addNode);
        ids.deleteNode.addEventListener('click', deleteNode);
        ids.addEdge.addEventListener('click', addEdge);
        ids.deleteEdge.addEventListener('click', deleteEdge);
        ids.exportJson.addEventListener('click', exportJson);
        ids.nodeForm.addEventListener('input', updateSelectedNode);
        ids.edgeForm.addEventListener('input', updateSelectedEdge);
        ids.mapOverlay.addEventListener('click', moveSelectedNodeFromMap);
        selectLevel(state.data.levels[0].level);
      }

      function camel(id) { return id.replace(/-([a-z])/g, (_, c) => c.toUpperCase()); }
      function crossLevelEdges(data) { const floorById = new Map(data.graph.nodes.map(node => [node.id, node.floor])); return data.graph.edges.filter(edge => floorById.get(edge.from) !== floorById.get(edge.to)); }
      function selectLevel(levelNumber) { state.level = state.data.levels.find(level => level.level === levelNumber); state.building = 'all'; state.selectedNode = visibleNodes()[0] || state.level.nodes[0] || null; state.selectedEdge = visibleEdges()[0] || state.level.edges[0] || null; renderAll(); }
      function selectBuilding(building) { state.building = building; state.selectedNode = visibleNodes()[0] || null; state.selectedEdge = visibleEdges()[0] || null; renderAll(); }
      function renderAll() { rebuildGraph(); renderBuildingOptions(); renderMap(); renderNodeList(); renderNodeForm(); renderEdgeList(); renderEdgeForm(); }

      function renderBuildingOptions() {
        const buildings = [...new Set(state.level.nodes.map(buildingKey))].sort();
        ids.buildingSelect.innerHTML = '<option value="all">All buildings</option>' + buildings.map(building => '<option value="' + escapeHtml(building) + '">' + escapeHtml(building) + ' Building</option>').join('');
        ids.buildingSelect.value = buildings.includes(state.building) ? state.building : 'all';
      }

      function renderMap() {
        const nodes = visibleNodes();
        const edges = visibleEdges();
        ids.mapTitle.textContent = state.level.label + ' architectural graph';
        ids.mapCount.textContent = nodes.length + ' visible nodes, ' + edges.length + ' visible edges';
        state.displayNodes = layoutNodes(nodes);
        state.bounds = displayBounds(state.displayNodes, nodes.length ? nodes : state.level.nodes);
        ids.mapOverlay.setAttribute('viewBox', state.bounds.minX + ' ' + state.bounds.minY + ' ' + state.bounds.width + ' ' + state.bounds.height);
        ids.mapOverlay.innerHTML = '';
        renderArchitecturalBase(nodes, edges);
        const nodeById = new Map(nodes.map(node => [node.id, node]));
        for (const edge of edges) {
          const from = nodeById.get(edge.from), to = nodeById.get(edge.to);
          if (!from || !to) continue;
          const fromPoint = displayPoint(from), toPoint = displayPoint(to);
          ids.mapOverlay.append(svg('line', { class: 'graph-edge', x1: fromPoint.x, y1: fromPoint.y, x2: toPoint.x, y2: toPoint.y }));
        }
        for (const node of nodes) renderEditableNode(node);
      }

      function renderArchitecturalBase(nodes, edges) {
        const drawableNodes = nodes.filter(node => node.kind !== 'stairs' && node.kind !== 'elevator');
        if (!drawableNodes.length) return;
        renderFloorPlate(drawableNodes);
        renderCorridors(nodes, edges);
        renderRooms(nodes);
        renderServiceCells(nodes);
      }

      function renderFloorPlate(nodes) {
        const groups = new Map();
        for (const node of nodes) {
          const key = buildingKey(node);
          groups.set(key, [...(groups.get(key) || []), node]);
        }
        for (const group of groups.values()) {
          if (group.length < 2) continue;
          const points = group.map(displayPoint);
          const xs = points.map(point => point.x), ys = points.map(point => point.y);
          const pad = Math.max(state.bounds.width, state.bounds.height) * .08;
          ids.mapOverlay.append(svg('rect', { class: 'floor-plate', x: Math.min(...xs) - pad, y: Math.min(...ys) - pad, width: Math.max(...xs) - Math.min(...xs) + pad * 2, height: Math.max(...ys) - Math.min(...ys) + pad * 2 }));
        }
      }

      function renderCorridors(nodes, edges) {
        const nodeById = new Map(nodes.map(node => [node.id, node]));
        for (const edge of edges) {
          const from = nodeById.get(edge.from), to = nodeById.get(edge.to);
          if (!from || !to) continue;
          const fromPoint = displayPoint(from), toPoint = displayPoint(to);
          ids.mapOverlay.append(svg('line', { class: 'corridor-wall', x1: fromPoint.x, y1: fromPoint.y, x2: toPoint.x, y2: toPoint.y }));
          ids.mapOverlay.append(svg('line', { class: 'corridor-floor', x1: fromPoint.x, y1: fromPoint.y, x2: toPoint.x, y2: toPoint.y }));
        }
      }

      function renderRooms(nodes) {
        for (const node of nodes.filter(node => node.kind === 'room')) {
          const group = svg('g', { class: 'room-cell' });
          const point = displayPoint(node);
          const width = roomWidth(node), height = 5.2;
          group.append(svg('rect', { x: point.x - width / 2, y: point.y - height / 2, width, height }));
          const label = svg('text', { x: point.x, y: point.y + .75 });
          label.textContent = node.label;
          group.append(label);
          ids.mapOverlay.append(group);
        }
      }

      function renderServiceCells(nodes) {
        for (const node of nodes.filter(node => node.kind === 'stairs' || node.kind === 'elevator')) {
          const group = svg('g', { class: 'service-cell ' + node.kind + '-cell' });
          const point = displayPoint(node);
          group.append(svg('rect', { x: point.x - 3.6, y: point.y - 2.4, width: 7.2, height: 4.8 }));
          const label = svg('text', { x: point.x, y: point.y + .65 });
          label.textContent = node.kind === 'stairs' ? 'Stairs' : 'Elev';
          group.append(label);
          ids.mapOverlay.append(group);
        }
      }

      function renderEditableNode(node) {
        const group = svg('g', { class: 'graph-node graph-node-' + node.kind + (node === state.selectedNode ? ' selected' : '') });
        const point = displayPoint(node);
        const width = nodeRectWidth(node), height = 5.8;
        group.append(svg('rect', { x: point.x - width / 2, y: point.y - height / 2, width, height, rx: .35 }));
        const text = svg('text', { x: point.x, y: point.y + .9 });
        text.textContent = node.label;
        group.append(text);
        group.addEventListener('click', event => { event.stopPropagation(); selectNode(node); });
        ids.mapOverlay.append(group);
      }

      function renderNodeList() {
        const nodes = visibleNodes();
        ids.nodeStatus.textContent = state.selectedNode ? state.selectedNode.id : 'No node selected';
        ids.nodeList.innerHTML = nodes.map(node => '<li><button type="button" data-id="' + escapeHtml(node.id) + '" class="' + (node === state.selectedNode ? 'active' : '') + '">' + escapeHtml(node.label) + '<small>' + escapeHtml(node.kind) + '</small></button></li>').join('');
        ids.nodeList.querySelectorAll('button').forEach(button => button.addEventListener('click', () => selectNode(nodes.find(node => node.id === button.dataset.id))));
      }

      function renderNodeForm() { const node = state.selectedNode; ids.nodeForm.querySelectorAll('input, select, textarea').forEach(field => field.disabled = !node); if (!node) { ids.nodeForm.reset(); ids.nodeJson.textContent = ''; return; } ids.nodeId.value = node.id; ids.nodeLabel.value = node.label; ids.nodeKind.value = node.kind; ids.nodeFloor.value = node.floor; ids.nodeX.value = node.x; ids.nodeY.value = node.y; ids.nodeExitBearing.value = node.exitBearing ?? ''; ids.nodeAliases.value = (node.aliases || []).join('\n'); ids.nodeJson.textContent = JSON.stringify(node, null, 2); }

      function renderEdgeList() {
        const edges = visibleEdges();
        ids.edgeList.innerHTML = edges.map(edge => '<li><button type="button" data-id="' + escapeHtml(edge.id) + '" class="' + (edge === state.selectedEdge ? 'active' : '') + '">' + escapeHtml(edge.id) + '<small>' + escapeHtml(edge.from) + ' -> ' + escapeHtml(edge.to) + '</small></button></li>').join('');
        ids.edgeList.querySelectorAll('button').forEach(button => button.addEventListener('click', () => selectEdge(edges.find(edge => edge.id === button.dataset.id))));
        const options = visibleNodes().map(node => '<option value="' + escapeHtml(node.id) + '">' + escapeHtml(node.label) + '</option>').join('');
        ids.edgeFrom.innerHTML = options;
        ids.edgeTo.innerHTML = options;
      }

      function renderEdgeForm() { const edge = state.selectedEdge; ids.edgeForm.querySelectorAll('input, select').forEach(field => field.disabled = !edge); if (!edge) { ids.edgeForm.reset(); return; } ids.edgeId.value = edge.id; ids.edgeFrom.value = edge.from; ids.edgeTo.value = edge.to; ids.edgeWeight.value = edge.weight; ids.edgeBearing.value = edge.bearing; ids.edgeKind.value = edge.kind; }
      function selectNode(node) { state.selectedNode = node; renderAll(); }
      function selectEdge(edge) { state.selectedEdge = edge; renderEdgeList(); renderEdgeForm(); }

      function updateSelectedNode() { const node = state.selectedNode; if (!node) return; const oldId = node.id; node.id = ids.nodeId.value.trim() || oldId; node.label = ids.nodeLabel.value.trim() || node.id; node.kind = ids.nodeKind.value; node.floor = Number(ids.nodeFloor.value) || state.level.level; node.x = Number(ids.nodeX.value) || 0; node.y = Number(ids.nodeY.value) || 0; const exitBearing = ids.nodeExitBearing.value.trim(); if (exitBearing === '') delete node.exitBearing; else node.exitBearing = Number(exitBearing); const aliases = ids.nodeAliases.value.split('\n').map(value => value.trim()).filter(Boolean); if (aliases.length) node.aliases = aliases; else delete node.aliases; if (oldId !== node.id) renameNodeReferences(oldId, node.id); if (state.building !== 'all' && buildingKey(node) !== state.building) state.building = buildingKey(node); renderAll(); }
      function updateSelectedEdge() { const edge = state.selectedEdge; if (!edge) return; edge.id = ids.edgeId.value.trim() || edge.id; edge.from = ids.edgeFrom.value; edge.to = ids.edgeTo.value; edge.weight = Number(ids.edgeWeight.value) || 1; edge.bearing = normalizedBearing(Number(ids.edgeBearing.value) || 0); edge.kind = ids.edgeKind.value; renderAll(); }
      function addNode() { const id = uniqueId((state.building === 'all' ? 'new' : state.building.toLowerCase()) + '-node'); const node = { id, label: id, kind: 'room', floor: state.level.level, x: round((state.bounds?.minX || 0) + (state.bounds?.width || 0) / 2), y: round((state.bounds?.minY || 0) + (state.bounds?.height || 0) / 2) }; state.level.nodes.push(node); state.selectedNode = node; if (state.building !== 'all') state.building = buildingKey(node); renderAll(); }
      function deleteNode() { const node = state.selectedNode; if (!node || !confirm('Delete ' + node.label + '? This also removes connected same-floor edges.')) return; state.level.nodes = state.level.nodes.filter(candidate => candidate !== node); state.level.edges = state.level.edges.filter(edge => edge.from !== node.id && edge.to !== node.id); state.crossLevelEdges = state.crossLevelEdges.filter(edge => edge.from !== node.id && edge.to !== node.id); state.selectedNode = visibleNodes()[0] || null; state.selectedEdge = visibleEdges()[0] || null; renderAll(); }
      function addEdge() { const nodes = visibleNodes(); if (nodes.length < 2) return; const from = state.selectedNode?.id || nodes[0].id; const to = nodes.find(node => node.id !== from)?.id || from; const edge = { id: uniqueId('new-edge'), from, to, weight: 4, bearing: 90, kind: 'walk' }; state.level.edges.push(edge); state.selectedEdge = edge; renderAll(); }
      function deleteEdge() { const edge = state.selectedEdge; if (!edge || !confirm('Delete edge ' + edge.id + '?')) return; state.level.edges = state.level.edges.filter(candidate => candidate !== edge); state.selectedEdge = visibleEdges()[0] || null; renderAll(); }
      function moveSelectedNodeFromMap(event) { if (!state.selectedNode || event.target.closest?.('.graph-node')) return; const rect = ids.mapOverlay.getBoundingClientRect(); const xRatio = (event.clientX - rect.left) / rect.width; const yRatio = (event.clientY - rect.top) / rect.height; state.selectedNode.x = round(state.bounds.minX + xRatio * state.bounds.width); state.selectedNode.y = round(state.bounds.minY + yRatio * state.bounds.height); renderAll(); }
      function renameNodeReferences(oldId, newId) { for (const level of state.data.levels) for (const edge of level.edges) { if (edge.from === oldId) edge.from = newId; if (edge.to === oldId) edge.to = newId; } for (const edge of state.crossLevelEdges) { if (edge.from === oldId) edge.from = newId; if (edge.to === oldId) edge.to = newId; } }
      function rebuildGraph() { const nodes = state.data.levels.flatMap(level => level.nodes); const nodeIds = new Set(nodes.map(node => node.id)); const sameFloorEdges = state.data.levels.flatMap(level => level.edges); const crossEdges = state.crossLevelEdges.filter(edge => nodeIds.has(edge.from) && nodeIds.has(edge.to)); state.data.graph = { nodes, edges: [...sameFloorEdges, ...crossEdges] }; }
      function exportJson() { rebuildGraph(); const blob = new Blob([JSON.stringify(state.data, null, 2) + '\n'], { type: 'application/json' }); const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = 'levels-1-2.updated.json'; link.click(); URL.revokeObjectURL(url); }

      function layoutNodes(nodes) {
        const placed = [];
        const layouts = new Map();
        const sortedNodes = [...nodes].sort((left, right) => buildingKey(left).localeCompare(buildingKey(right)) || left.y - right.y || left.x - right.x || left.label.localeCompare(right.label));
        for (const node of sortedNodes) {
          const size = nodeSize(node);
          const point = { x: node.x, y: node.y };
          let column = 0;
          let attempts = 0;
          while (placed.some(item => boxesOverlap(point, size, item)) && attempts < 160) {
            const direction = attempts % 2 === 0 ? 1 : -1;
            const row = Math.ceil((attempts + 1) / 2);
            point.y = node.y + direction * row * (size.height + 1.6);
            point.x = node.x + column * (size.width + 2.2);
            if (row > 8) column += 1;
            attempts += 1;
          }
          const layout = { node, x: round(point.x), y: round(point.y), width: size.width, height: size.height };
          layouts.set(node.id, layout);
          placed.push(layout);
        }
        return layouts;
      }

      function boxesOverlap(point, size, item) {
        const margin = .9;
        return Math.abs(point.x - item.x) < (size.width + item.width) / 2 + margin && Math.abs(point.y - item.y) < (size.height + item.height) / 2 + margin;
      }

      function nodeSize(node) {
        if (node.kind === 'stairs' || node.kind === 'elevator') return { width: 7.2, height: 4.8 };
        if (node.kind === 'room') return { width: nodeRectWidth(node), height: 5.8 };
        return { width: Math.max(8, node.label.length * .95 + 3.8), height: 5.8 };
      }

      function displayPoint(node) {
        const layout = state.displayNodes.get(node.id);
        return layout ? { x: layout.x, y: layout.y } : { x: node.x, y: node.y };
      }

      function displayBounds(layouts, fallbackNodes) {
        const values = [...layouts.values()];
        if (!values.length) return graphBounds(fallbackNodes);
        const xs = values.flatMap(item => [item.x - item.width / 2, item.x + item.width / 2]);
        const ys = values.flatMap(item => [item.y - item.height / 2, item.y + item.height / 2]);
        const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
        const width = Math.max(1, maxX - minX), height = Math.max(1, maxY - minY), padding = Math.max(width, height) * .18;
        return { minX:minX-padding, minY:minY-padding, width:width+padding*2, height:height+padding*2 };
      }

      function visibleNodes() { return state.level.nodes.filter(node => state.building === 'all' || buildingKey(node) === state.building); }
      function visibleEdges() { const nodeIds = new Set(visibleNodes().map(node => node.id)); return state.level.edges.filter(edge => nodeIds.has(edge.from) && nodeIds.has(edge.to)); }
      function buildingKey(node) { const match = node.id.match(/[A-Za-z]/); return match ? match[0].toUpperCase() : 'Other'; }
      function graphBounds(nodes) { if (!nodes.length) return { minX:-10, minY:-10, width:20, height:20 }; const xs = nodes.map(node => node.x), ys = nodes.map(node => node.y); const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys); const width = Math.max(1, maxX - minX), height = Math.max(1, maxY - minY), padding = Math.max(width, height) * .14; return { minX:minX-padding, minY:minY-padding, width:width+padding*2, height:height+padding*2 }; }
      function uniqueId(prefix) { const existing = new Set(state.data.levels.flatMap(level => level.nodes.map(node => node.id)).concat(state.data.levels.flatMap(level => level.edges.map(edge => edge.id)))); let index = 1; while (existing.has(prefix + '-' + index)) index += 1; return prefix + '-' + index; }
      function svg(name, attrs = {}) { const el = document.createElementNS('http://www.w3.org/2000/svg', name); for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, String(value)); return el; }
      function nodeRectWidth(node) { return Math.max(7.2, Math.min(18, node.label.length * 1.05 + 4)); }
      function roomWidth(node) { return Math.max(7.2, Math.min(15, node.label.length * 1.05 + 3.2)); }
      function normalizedBearing(value) { return ((value % 360) + 360) % 360; }
      function round(value) { return Math.round(value * 10) / 10; }
      function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char])); }
    </script>
  </body>
</html>
